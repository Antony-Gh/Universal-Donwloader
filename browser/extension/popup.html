<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Universal Media Downloader</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 12px;
      width: 340px;
      background: #0f131d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #e2e8f0;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #1e293b;
      color: #38bdf8;
      font-weight: 600;
    }
    .url-box {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #2e3a59;
      background: #161b29;
      color: #f1f5f9;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-video { background: #2563eb; }
    .btn-mp3 { background: #059669; }
    .btn-sniff {
      width: 100%;
      background: #0f766e;
      margin-bottom: 8px;
    }
    .stream-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stream-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #182030;
      border: 1px solid #263248;
      font-size: 11px;
    }
    .stream-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      color: #cbd5e1;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Universal Downloader</span>
    <span id="hostBadge" class="badge">Checking Host...</span>
  </div>
  <input id="urlInput" class="url-box" type="text" placeholder="Paste or detect media URL..." />
  <div class="btn-row">
    <button id="downloadVideoBtn" class="btn-video" type="button">⬇ Video (MP4)</button>
    <button id="downloadMp3Btn" class="btn-mp3" type="button">🎵 Audio (MP3)</button>
  </div>
  <button id="sniffTabBtn" class="btn-sniff" type="button">Sniff Embedded Streams on Tab</button>
  <div id="streamList" class="stream-list"></div>
  <div id="statusText" class="status">Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
