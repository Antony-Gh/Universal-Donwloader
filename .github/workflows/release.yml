name: Build and Publish Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v2.8.0)"
        required: true
        default: "v2.8.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Python Executable
        run: |
          pyinstaller downloader.spec --noconfirm

      - name: Fetch Static FFmpeg for Windows Bundle
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip" -TimeoutSec 60
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
            $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            if ($ffmpegExe) { Copy-Item $ffmpegExe.FullName dist/ffmpeg.exe -Force }
            if ($ffprobeExe) { Copy-Item $ffprobeExe.FullName dist/ffprobe.exe -Force }
            Write-Host "FFmpeg successfully staged for embedding."
          } catch {
            Write-Host "FFmpeg staging failed, client-side auto-bootstrap will handle on run: $_"
          }

      - name: Publish Avalonia App (Windows x64 Single-File)
        run: |
          dotnet publish src/UniversalDownloader.Avalonia/UniversalDownloader.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build_out/windows

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          if (Test-Path build_out/windows/UniversalDownloader.exe) {
            Copy-Item build_out/windows/UniversalDownloader.exe UniversalDownloader.exe
          } elseif (Test-Path build_out/windows/UniversalDownloader.Avalonia.exe) {
            Copy-Item build_out/windows/UniversalDownloader.Avalonia.exe UniversalDownloader.exe
          }

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-windows-single
          path: UniversalDownloader.exe

      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build Windows MSI Installer
        shell: pwsh
        run: |
          python installer/windows/build_msi.py --exe UniversalDownloader.exe --out UniversalDownloader-Setup-x64.msi

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-windows-msi
          path: UniversalDownloader-Setup-x64.msi

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Python Executable (Linux ELF)
        run: |
          pyinstaller downloader.spec --noconfirm

      - name: Publish Avalonia App (Linux x64)
        run: |
          dotnet publish src/UniversalDownloader.Avalonia/UniversalDownloader.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build_out/linux/avalonia

      - name: Package Linux Release Archive
        run: |
          mkdir -p dist_package/UniversalDownloader-linux-x64
          if [ -f build_out/linux/avalonia/UniversalDownloader ]; then
            cp build_out/linux/avalonia/UniversalDownloader dist_package/UniversalDownloader-linux-x64/
          elif [ -f build_out/linux/avalonia/UniversalDownloader.Avalonia ]; then
            cp build_out/linux/avalonia/UniversalDownloader.Avalonia dist_package/UniversalDownloader-linux-x64/UniversalDownloader
          fi
          [ -f dist/downloader ] && cp dist/downloader dist_package/UniversalDownloader-linux-x64/ || true
          [ -f /usr/bin/ffmpeg ] && cp /usr/bin/ffmpeg dist_package/UniversalDownloader-linux-x64/ || true
          [ -f /usr/bin/ffprobe ] && cp /usr/bin/ffprobe dist_package/UniversalDownloader-linux-x64/ || true
          [ -f README.md ] && cp README.md dist_package/UniversalDownloader-linux-x64/ || true
          [ -d assets ] && cp -r assets dist_package/UniversalDownloader-linux-x64/ 2>/dev/null || true
          chmod +x dist_package/UniversalDownloader-linux-x64/* 2>/dev/null || true

          tar -czvf UniversalDownloader-linux-x64.tar.gz -C dist_package/UniversalDownloader-linux-x64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-linux-x64
          path: UniversalDownloader-linux-x64.tar.gz

  build-macos:
    name: Build macOS (ARM64 & x64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install system tools
        run: |
          brew install ffmpeg || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Python Executable (macOS Mach-O)
        run: |
          pyinstaller downloader.spec --noconfirm

      - name: Publish Avalonia App (macOS ARM64 Apple Silicon)
        run: |
          dotnet publish src/UniversalDownloader.Avalonia/UniversalDownloader.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build_out/macos-arm64

      - name: Publish Avalonia App (macOS x64 Intel)
        run: |
          dotnet publish src/UniversalDownloader.Avalonia/UniversalDownloader.Avalonia.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build_out/macos-x64

      - name: Package macOS Releases
        run: |
          mkdir -p dist_package/arm64 dist_package/x64

          # ARM64 package
          if [ -f build_out/macos-arm64/UniversalDownloader ]; then
            cp build_out/macos-arm64/UniversalDownloader dist_package/arm64/
          elif [ -f build_out/macos-arm64/UniversalDownloader.Avalonia ]; then
            cp build_out/macos-arm64/UniversalDownloader.Avalonia dist_package/arm64/UniversalDownloader
          fi
          cp build_out/macos-arm64/*.dylib dist_package/arm64/ 2>/dev/null || true
          [ -f dist/downloader ] && cp dist/downloader dist_package/arm64/ || true
          [ -f README.md ] && cp README.md dist_package/arm64/ || true
          chmod +x dist_package/arm64/* 2>/dev/null || true
          tar -czvf UniversalDownloader-macos-arm64.tar.gz -C dist_package/arm64 .

          # x64 package
          if [ -f build_out/macos-x64/UniversalDownloader ]; then
            cp build_out/macos-x64/UniversalDownloader dist_package/x64/
          elif [ -f build_out/macos-x64/UniversalDownloader.Avalonia ]; then
            cp build_out/macos-x64/UniversalDownloader.Avalonia dist_package/x64/UniversalDownloader
          fi
          cp build_out/macos-x64/*.dylib dist_package/x64/ 2>/dev/null || true
          [ -f dist/downloader ] && cp dist/downloader dist_package/x64/ || true
          [ -f README.md ] && cp README.md dist_package/x64/ || true
          chmod +x dist_package/x64/* 2>/dev/null || true
          tar -czvf UniversalDownloader-macos-x64.tar.gz -C dist_package/x64 .

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-macos-arm64
          path: UniversalDownloader-macos-arm64.tar.gz

      - name: Upload macOS x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-macos-x64
          path: UniversalDownloader-macos-x64.tar.gz

  build-android:
    name: Build Android APK (ARM64 & Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode Android Release Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/release-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release-keystore.jks" >> "$GITHUB_ENV"
            echo "✓ Release keystore decoded for production APK signing."
          else
            echo "⚠ ANDROID_KEYSTORE_BASE64 secret not configured — falling back to debug signing."
          fi

      - name: Build Android Release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Stage Android APKs
        run: |
          mkdir -p android_out
          cp android/app/build/outputs/apk/release/*arm64-v8a*.apk android_out/UniversalDownloader-android-arm64.apk
          cp android/app/build/outputs/apk/release/*universal*.apk android_out/UniversalDownloader-android-universal.apk

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-android-arm64
          path: android_out/UniversalDownloader-android-arm64.apk

      - name: Upload Android Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-android-universal
          path: android_out/UniversalDownloader-android-universal.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Universal Media Downloader ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/UniversalDownloader.exe
            release_assets/UniversalDownloader-Setup-x64.msi
            release_assets/UniversalDownloader-linux-x64.tar.gz
            release_assets/UniversalDownloader-macos-arm64.tar.gz
            release_assets/UniversalDownloader-macos-x64.tar.gz
            release_assets/UniversalDownloader-android-arm64.apk
            release_assets/UniversalDownloader-android-universal.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
